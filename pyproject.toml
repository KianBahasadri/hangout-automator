[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hangout-automator"
version = "0.1.0"
description = "MVP website that plans hangouts and invites people by SMS"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy==2.0.40",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "python-multipart==0.0.20",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "apscheduler==3.11.0",
    "twilio==9.5.2",
    "clerk-backend-api==6.0.1",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
]

[project.scripts]
dev = "app.server:dev"
worker = "app.worker:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff==0.11.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# Warnings are failures: a deprecated call silently changing meaning (an HTTP
# client quietly not sending a form, say) turns a passing test into a test of
# nothing. Add a targeted "ignore::..." entry when a dependency forces one.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
