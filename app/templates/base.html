<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Hangout Automator{% endblock %}</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/static/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/static/favicon-16.png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="wrap">
      <a class="logo" href="/">
        <img class="logo-icon" src="/static/icon-192.png" width="32" height="32" alt="" />
        Hangout Automator
      </a>
      <nav>
        <a href="/">Home</a>
        <a href="/profiles">Profiles</a>
        <a href="/settings">Settings</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
