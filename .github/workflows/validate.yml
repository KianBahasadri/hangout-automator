name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app-and-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v9

      - name: Run application tests
        # uv installs the dev dependency group from pyproject.toml, so CI runs
        # the same suite as `uv run --group dev pytest` locally.
        run: uv run --group dev --python 3.12 pytest

      - uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize and validate application infrastructure
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      - name: Initialize and validate state bootstrap
        run: |
          terraform -chdir=terraform/bootstrap-state init -backend=false
          terraform -chdir=terraform/bootstrap-state validate
