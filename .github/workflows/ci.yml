name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hangout
          POSTGRES_PASSWORD: hangout
          POSTGRES_DB: hangout_test
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Never install from requirements.txt here — it has no pytest and no dev
      # deps. The whole point of the workflow is that the suite actually runs.
      - run: uv sync --group dev
      - run: uv run --group dev pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://hangout:hangout@localhost:5432/hangout_test

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
